}

tasks.register('extractMinecraftSources', Sync) {
    group = 'documentation'
    description = 'Extracts exact-version decompiled Minecraft/Forge sources for local inspection.'
    dependsOn 'createMinecraftArtifacts'
    from(zipTree(layout.buildDirectory.file("moddev/artifacts/forge-${minecraft_version}-${forge_version}-sources.jar")))
    into(layout.buildDirectory.dir('audit/minecraft'))
}
