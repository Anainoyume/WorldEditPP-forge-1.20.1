subprojects {
    apply plugin: 'java-library'

    group = 'com.redawn.common'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}

project(':gizmo') {
    dependencies {
        api project(':selection')
    }
}
